<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A Message For You</title>
<link rel="stylesheet" href="message.css">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>
<body>

<div class="paper" id="paperEl">
  <div class="paper-header">
    <span class="eyebrow">A Message<br/>For You</span>

    <div class="photo-upload" id="photoUpload">
     

      <div class="photo-circle" id="photoCircle" role="button" tabindex="0" aria-label="Add a photo">
        <svg class="plus" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
        </svg>
        <img id="photoPreview" alt="Uploaded photo" />
      </div>
      <button type="button" class="remove-photo" id="removePhoto" aria-label="Remove photo">&times;</button>
      <span class="photo-hint">Add a photo</span>
      <input type="file" id="photoInput" accept="image/*" hidden tabindex="-1" />
    </div>
  </div>

  <div class="lines-bg">
    <div class="letter">
      <p class="greeting line-1" id="greeting" contenteditable="true" role="textbox" aria-label="Greeting">Dear friend,</p>
      <div class="letter-body" id="letterBody" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Your message" data-placeholder="Write your message here"><br></div>
      <p class="signoff line-1" id="signoff" contenteditable="true" role="textbox" aria-label="Sign-off">With love,</p>
      <p class="writer-name line-1" id="writerName" contenteditable="true" role="textbox" aria-label="Your name" data-placeholder="Your name"><br></p>
    </div>
  </div>

  <div class="paper-footer">
    
    <button type="button" class="seal-btn" id="sealBtn"><span>Seal &amp; Save</span></button>
  </div>
</div>

<div class="thanks-overlay" id="thanksOverlay" role="status" aria-live="polite">
  <div class="thanks-copy">
    <p class="thanks-text">We'll miss you — thanks for letting us know.</p>
  </div>
</div>

<script>


const photoUpload = document.getElementById('photoUpload');
  const photoCircle = document.getElementById('photoCircle');
  const photoInput = document.getElementById('photoInput');
  const photoPreview = document.getElementById('photoPreview');
  const removeBtn = document.getElementById('removePhoto');
  const sealBtn = document.getElementById('sealBtn');
  const paperEl = document.getElementById('paperEl');
  const letterBody = document.getElementById('letterBody');
  const greeting = document.getElementById('greeting');
  const signoff = document.getElementById('signoff');
  const writerName = document.getElementById('writerName');
  const linesBg = document.querySelector('.lines-bg');
  const thanksOverlay = document.getElementById('thanksOverlay');

  // Paste your deployed Google Apps Script Web App URL here (see
  // apps-script/Code.gs setup instructions). Leave as-is to skip the
  // Drive upload — the local PNG download will still work either way.
  const DRIVE_UPLOAD_URL = 'https://script.google.com/macros/s/AKfycbzVuCN3sa4AKRd_cTgzKaFOfM-yulk59EufL49pqee6WwKxvGRH_6UmSmEhkOOPEeClGQ/exec';

  function flashLimit(){
    linesBg.style.background = 'rgba(169,131,79,0.08)';
    setTimeout(() => { linesBg.style.background = ''; }, 150);
  }

  // Counts actual rendered lines inside a given editable element, by
  // grouping its text rects into distinct vertical positions.
  //
  // Uses a tolerance band instead of exact-match rounding because some
  // Android browsers (Samsung Internet in particular, and foldables
  // like the Z Flip where the viewport can reflow mid-interaction)
  // report rects for the same visual line with top values that differ
  // by a fraction of a pixel -- e.g. 142.3 vs 142.7. Math.round() alone
  // turns that into 142 vs 143: two different "lines" for what is
  // visually one, which both misplaces the first couple of lines and
  // lets the 9-line cap undercount (so it never blocks the line that
  // would push past the limit). Grouping by proximity instead of exact
  // rounded equality collapses those near-duplicates back into one line
  // reliably, regardless of the device's rounding behavior.
  //
  // el.offsetHeight is read (and discarded) purely to force a layout
  // flush before measuring -- on some Android/foldable browsers, rects
  // read immediately after a fold/unfold or focus change can reflect a
  // stale layout until something forces a reflow.
  const LINE_TOP_TOLERANCE_PX = 4;

  function lineCountOf(el){
    void el.offsetHeight; // force layout flush before measuring
    const range = document.createRange();
    range.selectNodeContents(el);
    const rects = range.getClientRects();
    if (!rects.length) return 1;
    const tops = [];
    for (const r of rects){
      if (r.height === 0) continue;
      const t = r.top;
      const existing = tops.find(known => Math.abs(known - t) <= LINE_TOP_TOLERANCE_PX);
      if (existing === undefined){
        tops.push(t);
      }
    }
    const brCount = el.querySelectorAll('br').length;
    return Math.max(tops.length, brCount || 1);
  }

  const MAX_LINES = 9;

  // Multi-line guard, used only by the body. Rolls back any input (typed
  // letter, paste, autocorrect, IME) that pushes past MAX_LINES. Checks
  // unconditionally against maxLines — NOT gated on comparison to the
  // previous count — so there's no path for overflow to compound or slip
  // through regardless of how large a single input event's jump is.
  function wireMultiLineCap(el, maxLines){
    let lastGoodHTML = el.innerHTML;

    el.addEventListener('input', () => {
      if (lineCountOf(el) > maxLines){
        el.innerHTML = lastGoodHTML;
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        flashLimit();
      } else {
        lastGoodHTML = el.innerHTML;
      }
    });

    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && lineCountOf(el) >= maxLines){
        e.preventDefault();
        flashLimit();
      }
    });
  }

  // Single-line guard, used by greeting/sign-off/name. Enter is always
  // blocked (these fields are one line by design), and any input that
  // makes the text wrap onto a second visual line is rolled back — same
  // rollback approach as the body, just capped at 1 line instead of 9.
  // Also guards against the field losing its content entirely (backspaced
  // to nothing), which would make it collapse and become unclickable —
  // a bare <br> is restored so it always stays a clickable target.
  function wireSingleLineCap(el){
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter'){
        e.preventDefault();
        flashLimit();
      }
    });

    let lastGoodHTML = el.innerHTML;

    el.addEventListener('input', () => {
      if (lineCountOf(el) > 1){
        el.innerHTML = lastGoodHTML;
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        flashLimit();
        return;
      }
      if (el.innerHTML.trim() === ''){
        el.innerHTML = '<br>';
      }
      lastGoodHTML = el.innerHTML;
    });
  }

  wireMultiLineCap(letterBody, MAX_LINES);
  wireSingleLineCap(greeting);
  wireSingleLineCap(signoff);
  wireSingleLineCap(writerName);

  // Placeholder text ("Your name") shows only while the field is empty.
  // wireSingleLineCap already guarantees a <br> stays present if the
  // writer deletes back to nothing, so this only needs to toggle the
  // placeholder visibility, not manage emptiness itself.
  function refreshNamePlaceholder(){
    writerName.classList.toggle('is-empty', writerName.textContent.trim() === '');
  }
  writerName.addEventListener('input', refreshNamePlaceholder);
  refreshNamePlaceholder();

  // Same placeholder pattern for the message body itself, replacing the
  // ruled-lines background: a faint hint shows until the guest types,
  // toggled by checking textContent directly (unlike the name field,
  // wireMultiLineCap doesn't guarantee a <br> is restored when emptied,
  // but textContent is empty either way so the check is unaffected).
  function refreshBodyPlaceholder(){
    letterBody.classList.toggle('is-empty', letterBody.textContent.trim() === '');
  }
  letterBody.addEventListener('input', refreshBodyPlaceholder);
  refreshBodyPlaceholder();

  function setPhotoState(hasPhoto){
    photoCircle.classList.toggle('has-photo', hasPhoto);
    photoUpload.classList.toggle('has-photo', hasPhoto);
    photoCircle.setAttribute('aria-label', hasPhoto ? 'Change photo' : 'Add a photo');
  }

  photoCircle.addEventListener('click', () => photoInput.click());
  photoCircle.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      photoInput.click();
    }
  });

  photoInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      photoPreview.src = ev.target.result;
      setPhotoState(true);
    };
    reader.readAsDataURL(file);
  });

  removeBtn.addEventListener('click', () => {
    photoPreview.src = '';
    photoInput.value = '';
    setPhotoState(false);
  });

  // Sends the sealed PNG to the configured Google Apps Script endpoint,
  // which saves it into the client's Drive folder. This is now the ONLY
  // copy of the client's message — there is no local download anymore.
  //
  // Uses mode:'no-cors' because Apps Script Web Apps don't send back
  // readable CORS headers to a plain fetch from another origin — with
  // no-cors, the request still goes through and Apps Script still saves
  // the file, but the browser hides the response from our JS. This means
  // a genuine network failure (offline, DNS failure, endpoint totally
  // unreachable) WILL throw and be caught by the caller — but an error
  // happening inside Apps Script itself (bad folder ID, script bug)
  // still resolves as "successful" here, since no-cors hides HTTP-level
  // failure too. If you need fully confirmed delivery status in the UI,
  // the Apps Script would need to be fronted by something that sets CORS
  // headers (a small proxy, or Apps Script's own doOptions handling) —
  // flagging this as a known limitation rather than a solved problem.
  async function uploadToDrive(dataUrl, name){
    if (!DRIVE_UPLOAD_URL || DRIVE_UPLOAD_URL.indexOf('PASTE_YOUR') === 0){
      console.error('Drive upload SKIPPED: DRIVE_UPLOAD_URL is still the placeholder. Paste your Apps Script Web App URL into message.html.');
      alert('This message could not be saved — the Drive upload link hasn\'t been set up in this file yet. Nothing was saved anywhere.');
      throw new Error('DRIVE_UPLOAD_URL not configured');
    }
    await fetch(DRIVE_UPLOAD_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight
      body: JSON.stringify({ image: dataUrl, name: name })
    });
    // Deliberately no try/catch here — a thrown error must propagate up
    // to the seal button's handler so it can show "Try again" instead of
    // falsely reporting success.
  }
 
  // Full-screen thank-you transition, shown only after a confirmed
  // successful save — never on failure, since "we'll miss you" would be
  // actively wrong to show if nothing was actually saved. Stays on
  // screen indefinitely once shown — no auto-dismiss, no tap-to-close.
  // Does not clear the letter's content — the guest's message/photo/name
  // stay exactly as they left them if the overlay is ever hidden again.
  function showThanksOverlay(){
    paperEl.classList.add('leaving');
    thanksOverlay.classList.add('visible');
  }
  function hideThanksOverlay(){
    thanksOverlay.classList.remove('visible');
    paperEl.classList.remove('leaving');
  }

  // html2canvas has a long-documented limitation where overflow:hidden
  // is not always respected during capture — content that's correctly
  // clipped in the live page can still render in full in the exported
  // image. So overflow:hidden on .letter-body is not sufficient on its
  // own as an export-time safeguard. This function runs on the detached
  // clone right before capture (via onclone, so it can never affect what
  // the guest is actually typing) and physically removes trailing DOM
  // content until the clone's own measured line count is at or under
  // MAX_LINES — a genuine truncation, not a CSS clip, so it holds
  // regardless of how html2canvas chooses to render overflow.
  function truncateToLineLimit(clonedLetterBody, maxLines){
    // Same sub-pixel-drift issue as lineCountOf() (see its comment for
    // full detail): some Android browsers report rects for the same
    // visual line with top values a fraction of a pixel apart, which
    // exact-match rounding counts as two different lines instead of
    // one. Left unfixed here specifically, this function overcounts
    // how many lines exist, then deletes content down to what it
    // WRONGLY believes is maxLines -- silently cutting one real,
    // never-actually-overflowing line of the guest's message from the
    // exported PNG, even though the live editor correctly allowed it
    // (lineCountOf, which guards live typing, already carries this
    // same tolerance fix). Both places that count rendered lines must
    // agree, or exactly this mismatch happens: raw/live is correct,
    // export silently drops real content.
    function measure(){
      void clonedLetterBody.offsetHeight; // force layout flush before measuring
      const range = document.createRange();
      range.selectNodeContents(clonedLetterBody);
      const rects = range.getClientRects();
      const tops = [];
      for (const r of rects){
        if (r.height === 0) continue;
        const t = r.top;
        const existing = tops.find(known => Math.abs(known - t) <= LINE_TOP_TOLERANCE_PX);
        if (existing === undefined){
          tops.push(t);
        }
      }
      return tops.length;
    }
 
    function removeFromEnd(charsToRemove){
      let remaining = charsToRemove;
      while (remaining > 0 && clonedLetterBody.lastChild){
        const last = clonedLetterBody.lastChild;
        if (last.nodeType === Node.TEXT_NODE && last.textContent.length > 0){
          const take = Math.min(remaining, last.textContent.length);
          last.textContent = last.textContent.slice(0, -take);
          remaining -= take;
          if (last.textContent.length === 0) clonedLetterBody.removeChild(last);
        } else {
          clonedLetterBody.removeChild(last);
          remaining -= 1; // non-text nodes (e.g. <br>) count as one unit
        }
      }
    }
 
    // Coarse pass: remove a chunk sized proportionally to how far over
    // the limit we are (estimated ~40 chars/line), so convergence speed
    // scales with the overflow instead of being bounded by a fixed step
    // size — this holds even for pathologically long pasted input.
    let coarseGuard = 0;
    while (measure() > maxLines + 2 && clonedLetterBody.lastChild && coarseGuard < 1000){
      const overBy = measure() - maxLines;
      removeFromEnd(Math.max(40, overBy * 40));
      coarseGuard++;
    }
 
    // Fine pass: once close, drop to single-character precision so we
    // land exactly at maxLines rather than overshooting.
    let fineGuard = 0;
    while (measure() > maxLines && clonedLetterBody.lastChild && fineGuard < 500){
      removeFromEnd(1);
      fineGuard++;
    }
 
    // Last-resort backstop: if pathological input somehow still isn't
    // within budget after both passes (should not happen in practice,
    // but this must never leave the export in an unbounded state),
    // forcibly clear everything past maxLines' worth of content.
    if (measure() > maxLines){
      clonedLetterBody.textContent = '';
    }
  }
 
  sealBtn.addEventListener('click', async () => {
    const label = sealBtn.querySelector('span');
    const original = label.textContent;
    sealBtn.disabled = true;
    label.textContent = 'Saving…';
    paperEl.classList.add('exporting');

    try{
      if (typeof html2canvas !== 'function') throw new Error('unavailable');
      const canvas = await html2canvas(paperEl, {
        backgroundColor: null,
        scale: 2,
        ignoreElements: (el) => el.id === 'sealBtn' || el.classList.contains('paper-footer'),
        onclone: (clonedDoc) => {
          const clonedPaper = clonedDoc.getElementById('paperEl');
          if (clonedPaper){
            // Force the entrance animation to its settled end state so the
            // clone isn't captured mid fade-in (washed-out colors).
            clonedPaper.style.animation = 'none';
            clonedPaper.style.opacity = '1';
            clonedPaper.style.transform = 'translateY(0) rotate(-0.6deg)';
            // Belt-and-suspenders: make sure the exporting class (which
            // hides .paper-footer via CSS) survived onto the clone too.
            clonedPaper.classList.add('exporting');

            // Force identical export dimensions on every device. The
            // live .paper uses width:min(440px, 90vw) and
            // min-height:min(640px, 85vh) so it fits comfortably on any
            // screen while the guest is typing — but that means the
            // ACTUAL rendered size differs by device (a narrow phone
            // renders smaller than 440px). Left alone, that would make
            // Android and iPhone exports come out at different pixel
            // dimensions.
            //
            // IMPORTANT: read the guest's ACTUAL live width/font-size
            // BEFORE changing anything on the clone. The guest's typing
            // guard (wireMultiLineCap) already guarantees their message
            // fits within MAX_LINES at whatever size their real device
            // was rendering at — that guarantee must be preserved, not
            // re-checked against different geometry. A previous version
            // of this code reset font-size to a fixed absolute value
            // (desktop's 20px) regardless of what size the guest
            // actually typed at. On a small phone rendering at 16.5px,
            // that made real, never-overflowing text re-wrap onto more
            // than 9 lines purely because the box grew and letters got
            // bigger — and truncateToLineLimit then correctly (by its
            // own logic) cut that "overflow," deleting real words the
            // guest wrote. The fix: scale font-size/line-height by the
            // SAME ratio the box width is being scaled by, so the
            // guest's original line-wrapping is preserved exactly —
            // just rendered bigger or smaller, never re-wrapped.
            const liveLetter = paperEl.querySelector('.letter');
            const liveWidth = paperEl.getBoundingClientRect().width;
            const liveFontSize = parseFloat(getComputedStyle(liveLetter || paperEl).fontSize) || 20;
            const liveLineH = parseFloat(getComputedStyle(paperEl).getPropertyValue('--line-h')) || 32;
            const targetWidth = 440;

            clonedPaper.style.width = targetWidth + 'px';
            clonedPaper.style.minHeight = '640px';
            clonedPaper.style.height = 'auto';

            // Read back the WIDTH THE CLONE ACTUALLY RESOLVED TO, rather
            // than assuming it equals targetWidth. html2canvas gives
            // elements that have a ::before pseudo-element (our .paper
            // does, for the noise-texture overlay) an internal
            // "___html2canvas___pseudoelement_before" proxy class as
            // part of how it simulates pseudo-elements — and confirmed
            // via direct testing, that proxy can silently cap the
            // element's resolved width below whatever style.width was
            // just set to, even with !important and even after a forced
            // reflow. Previously this scaleRatio assumed the clone
            // landed at exactly targetWidth (440px); it did not — it was
            // consistently clamped lower. Because every later
            // measurement (font-size, --line-h, and therefore
            // truncateToLineLimit's line count) was computed from that
            // wrong assumed ratio instead of the real one, the clone's
            // text re-wrapped at a different width than the guest's
            // original message did — silently pushing real, already-
            // fitting content over the 9-line limit, which
            // truncateToLineLimit then correctly (by its own logic, but
            // against the wrong wrapping) cut. Reading the resolved
            // width AFTER a forced reflow and using THAT for scaleRatio
            // keeps every later measurement consistent with whatever
            // html2canvas actually did — regardless of whether it's
            // exactly 440px or something less.
            void clonedPaper.offsetHeight;
            const actualClonedWidth = clonedPaper.getBoundingClientRect().width;
            const scaleRatio = actualClonedWidth / liveWidth;

            clonedPaper.style.setProperty('--line-h', (liveLineH * scaleRatio) + 'px');
            const clonedLetterForScale = clonedPaper.querySelector('.letter');
            if (clonedLetterForScale) clonedLetterForScale.style.fontSize = (liveFontSize * scaleRatio) + 'px';
            // Note: .thanks-text (the post-save overlay) does NOT need
            // resetting here — showThanksOverlay() only runs after this
            // capture completes, so the overlay is never part of the
            // exported PNG and its vw-based clamp() is irrelevant here.

            // Export-time safety net ONLY — not a second size check.
            // html2canvas doesn't reliably respect overflow:hidden
            // (confirmed — a known, long-standing limitation), so a
            // correctly-capped live editor can still export a PNG
            // showing uncapped content due to THAT rendering quirk
            // specifically. This must run against geometry that
            // preserves the guest's original proportions (see the
            // proportional scaling immediately above) — never against
            // geometry that changed their font size by a fixed amount,
            // which is what caused real content to be wrongly cut
            // before. This physically truncates the CLONE'S content
            // only — it never touches what the guest is actually
            // typing.
            const clonedLetterBody = clonedDoc.getElementById('letterBody');
            if (clonedLetterBody){
              // If the guest sealed the card without writing anything,
              // strip the placeholder state on the CLONE before capture
              // -- otherwise the low-opacity "Write your message here"
              // hint (shown live via .is-empty + ::before) would get
              // baked into the saved PNG as if it were their message.
              // Only the clone is touched; the guest's live, still-
              // editable field and its is-empty class are untouched.
              clonedLetterBody.classList.remove('is-empty');
              truncateToLineLimit(clonedLetterBody, MAX_LINES);
            }

            // html2canvas 1.4.1 has a known limitation where it doesn't
            // reliably honor object-fit:cover on <img> elements — instead
            // of cropping the image proportionally to fill its box (what
            // the live page correctly does via real browser CSS), it
            // draws the raw image stretched to match the box's exact
            // width/height, distorting the aspect ratio. This is
            // confirmed export-only: the live, still-editable preview
            // renders correctly, so this must never touch the live
            // element — only the detached clone, right before capture.
            //
            // Fix: replace the cloned <img> with a plain element using
            // background-image + background-size:cover instead.
            // background-size:cover is a much older, better-supported
            // CSS feature that html2canvas rasterizes correctly, so it
            // reproduces the same visual crop the guest actually sees.
            const clonedPhotoCircle = clonedDoc.querySelector('.photo-circle');
            const clonedPhotoImg = clonedDoc.getElementById('photoPreview');
            if (clonedPhotoCircle && clonedPhotoImg && clonedPhotoImg.src){
              const coverDiv = clonedDoc.createElement('div');
              coverDiv.style.position = 'absolute';
              coverDiv.style.inset = '0';
              coverDiv.style.width = '100%';
              coverDiv.style.height = '100%';
              coverDiv.style.backgroundImage = `url(${clonedPhotoImg.src})`;
              coverDiv.style.backgroundSize = 'cover';
              coverDiv.style.backgroundPosition = 'center';
              coverDiv.style.backgroundRepeat = 'no-repeat';
              clonedPhotoImg.replaceWith(coverDiv);
            }
          }
        }
      });

      // No local download anymore — Google Drive is now the only copy.
      // uploadToDrive is awaited (not fire-and-forget) so a genuine
      // network failure below is caught and shown as "Try again" rather
      // than a false "Saved" confirmation. Note this still can't detect
      // every failure: mode:'no-cors' means an internal Apps Script
      // error (bad folder ID, script bug) still resolves as "successful"
      // from the browser's point of view — only total unreachability
      // (offline, DNS failure, etc.) will actually throw here.
      const dataUrl = canvas.toDataURL('image/png');
      const enteredName = writerName.classList.contains('is-empty') ? '' : writerName.textContent.trim();
      await uploadToDrive(dataUrl, enteredName);

      label.textContent = 'Saved to Drive ✓';
      showThanksOverlay();
    }catch(err){
      label.textContent = 'Try again';
    }finally{
      paperEl.classList.remove('exporting');
      setTimeout(() => {
        label.textContent = original;
        sealBtn.disabled = false;
      }, 2200);
    }
  });
 
</script>
</body>
</html>
